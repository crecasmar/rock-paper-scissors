name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. LINT & TEST
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.11.1"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest and generate coverage
        run: npm run test:coverage

  # 2. BUILD & DEPLOY (SonarQube analysis runs in build.yml)
  build-and-deploy:
    name: Build & Deploy
    needs: lint-and-test # Stops the deploy if ESLint or tests fail
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate production build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
